<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Maison Bennani</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Reset Password</h1>
    <form id="resetForm">
      <label>New Password</label><input required id="newPassword" type="password" minlength="6" autocomplete="new-password">
      <label>Confirm Password</label><input required id="confirmPassword" type="password" minlength="6" autocomplete="new-password">
      <button class="btn" type="submit">Set New Password</button>
      <div class="error-msg" id="msg"></div>
    </form>
  </div>
</div>
<script src="/js/reset-password.js"></script>
</body>
</html>
